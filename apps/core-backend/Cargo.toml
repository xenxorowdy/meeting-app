[package]
name = "alpha-core-backend"
version = "2.0.0"
edition = "2021"
description = "Rust core engine for the Alpha meeting assistant"
license = "Commercial"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
# First TLS dependency in the tree: Gemini is HTTPS-only and the hand-rolled
# HTTP in stt.rs only works because the WhisperKit sidecar is plaintext localhost.
# rustls rather than default-features, so this does not drag in OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.132"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "signal", "fs", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
