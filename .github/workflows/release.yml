name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  mac:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core-backend

      - run: npm ci

      - name: Write desktop sign-in settings
        env:
          KESAMI_SUPABASE_URL: ${{ vars.KESAMI_SUPABASE_URL }}
          KESAMI_SUPABASE_PUBLISHABLE_KEY: ${{ vars.KESAMI_SUPABASE_PUBLISHABLE_KEY }}
          KESAMI_CLOUD_URL: ${{ vars.KESAMI_CLOUD_URL }}
        run: |
          if [ -z "$KESAMI_SUPABASE_URL" ] || [ -z "$KESAMI_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set repository variables KESAMI_SUPABASE_URL and KESAMI_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          {
            echo "KESAMI_AUTH_PROVIDER=supabase"
            echo "KESAMI_SUPABASE_URL=$KESAMI_SUPABASE_URL"
            echo "KESAMI_SUPABASE_PUBLISHABLE_KEY=$KESAMI_SUPABASE_PUBLISHABLE_KEY"
            : "${KESAMI_CLOUD_URL:?Set the KESAMI_CLOUD_URL repository variable to the HTTPS cloud relay origin}"
            echo "KESAMI_CLOUD_URL=$KESAMI_CLOUD_URL"
          } > apps/ui/.env

      - name: Set app version from tag
        run: npm pkg set version="${TAG#v}" -w apps/desktop

      - name: Build UI, backend and helpers
        run: npm run build:all && npm run build:mic-watch

      - name: Build unsigned app
        run: npm run --prefix apps/desktop dist:mac -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core-backend

      - run: npm ci

      - name: Write desktop sign-in settings
        env:
          KESAMI_SUPABASE_URL: ${{ vars.KESAMI_SUPABASE_URL }}
          KESAMI_SUPABASE_PUBLISHABLE_KEY: ${{ vars.KESAMI_SUPABASE_PUBLISHABLE_KEY }}
          KESAMI_CLOUD_URL: ${{ vars.KESAMI_CLOUD_URL }}
        run: |
          if [ -z "$KESAMI_SUPABASE_URL" ] || [ -z "$KESAMI_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set repository variables KESAMI_SUPABASE_URL and KESAMI_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          {
            echo "KESAMI_AUTH_PROVIDER=supabase"
            echo "KESAMI_SUPABASE_URL=$KESAMI_SUPABASE_URL"
            echo "KESAMI_SUPABASE_PUBLISHABLE_KEY=$KESAMI_SUPABASE_PUBLISHABLE_KEY"
            : "${KESAMI_CLOUD_URL:?Set the KESAMI_CLOUD_URL repository variable to the HTTPS cloud relay origin}"
            echo "KESAMI_CLOUD_URL=$KESAMI_CLOUD_URL"
          } > apps/ui/.env

      - name: Set app version from tag
        run: npm pkg set version="${TAG#v}" -w apps/desktop

      - name: Build UI and backend
        run: npm run build:all

      - name: Check the backend is self-contained
        run: |
          shopt -s nullglob
          test -f apps/core-backend/target/release/kesami-core-backend.exe
          dlls=(apps/core-backend/target/release/*.dll)
          if [ ${#dlls[@]} -gt 0 ]; then
            echo "::error::The backend was built with ${dlls[*]} beside it. Bundle them through build.win.extraResources in apps/desktop/package.json."
            exit 1
          fi

      - name: Build unsigned installer
        run: npm run --prefix apps/desktop dist:win -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/release/Kesami-Setup-x64.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: xenxorowdy/kesami-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a RELEASES_TOKEN secret with Contents read/write on $RELEASES_REPO"
            exit 1
          fi
          NOTES=$(printf '%s\n' \
            "### macOS" \
            "" \
            "Download **Kesami-${TAG#v}-arm64.dmg**, open it, and drag Kesami into Applications. Requires an Apple Silicon Mac with macOS 13 or later." \
            "" \
            "This build is unsigned and not notarized by Apple, so macOS may block the first launch. If you trust Kesami, open System Settings → Privacy & Security and click **Open Anyway**." \
            "" \
            "### Windows" \
            "" \
            "Download **Kesami-Setup-x64.exe** and run it. It installs Kesami for your user account, with no administrator prompt. Requires 64-bit Windows 10 or 11." \
            "" \
            "This installer is not code-signed, so Microsoft Defender SmartScreen may show **Windows protected your PC**. If you trust Kesami, click **More info**, then **Run anyway**.")
          FILES=(dist/*.dmg dist/*.zip dist/Kesami-Setup-x64.exe)
          if gh release view "$TAG" -R "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$RELEASES_REPO" "${FILES[@]}" --clobber
            gh release edit "$TAG" -R "$RELEASES_REPO" --notes "$NOTES"
          else
            gh release create "$TAG" -R "$RELEASES_REPO" "${FILES[@]}" --title "Kesami $TAG" --notes "$NOTES"
          fi
