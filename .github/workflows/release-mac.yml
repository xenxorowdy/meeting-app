name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAS_SIGNING: ${{ secrets.MAC_CERTS != '' && secrets.MAC_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core-backend

      - run: npm ci

      - name: Write desktop sign-in settings
        env:
          KESAMI_SUPABASE_URL: ${{ vars.KESAMI_SUPABASE_URL }}
          KESAMI_SUPABASE_PUBLISHABLE_KEY: ${{ vars.KESAMI_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$KESAMI_SUPABASE_URL" ] || [ -z "$KESAMI_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set repository variables KESAMI_SUPABASE_URL and KESAMI_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          {
            echo "KESAMI_AUTH_PROVIDER=supabase"
            echo "KESAMI_SUPABASE_URL=$KESAMI_SUPABASE_URL"
            echo "KESAMI_SUPABASE_PUBLISHABLE_KEY=$KESAMI_SUPABASE_PUBLISHABLE_KEY"
          } > apps/ui/.env

      - name: Set app version from tag
        run: npm pkg set version="${TAG#v}" -w apps/desktop

      - name: Build UI, backend and helpers
        run: npm run build:all && npm run build:mic-watch

      - name: Build signed and notarized app
        if: env.HAS_SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
        run: >
          npm run --prefix apps/desktop dist:mac --
          --publish never
          -c.mac.identity="$SIGNING_IDENTITY"
          -c.mac.hardenedRuntime=true
          -c.mac.notarize=true

      - name: Build unsigned app
        if: env.HAS_SIGNING != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run --prefix apps/desktop dist:mac -- --publish never

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            NOTES="Download **Kesami-${TAG#v}-arm64.dmg**, open it, and drag Kesami into Applications. Requires an Apple Silicon Mac."
          else
            NOTES=$(printf '%s\n' \
              "Download **Kesami-${TAG#v}-arm64.dmg**, open it, and drag Kesami into Applications. Requires an Apple Silicon Mac." \
              "" \
              "This build is not notarized by Apple yet, so macOS blocks the first launch. After copying it to Applications, run once in Terminal:" \
              "" \
              '```' \
              "xattr -dr com.apple.quarantine /Applications/Kesami.app" \
              '```' \
              "" \
              "Or open it once, then go to System Settings → Privacy & Security and click **Open Anyway**.")
          fi
          FILES=(apps/desktop/release/*.dmg apps/desktop/release/*.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "Kesami $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
